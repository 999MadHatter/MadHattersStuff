<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SklChat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- LANDING PAGE -->
    <section id="landingPage" class="page">

        <div class="landing-card">

            <div class="big-logo">💬</div>

            <h1>SklChat</h1>

            <p class="tagline">Talk. Connect. Chill.</p>

            <p class="description">
                A place to chat, meet people, and hang out.
            </p>

            <div class="landing-buttons">

                <button id="loginButton" class="primary-button">
                    Log In
                </button>

                <button id="signupButton" class="secondary-button">
                    Create Account
                </button>

            </div>

        </div>

    </section>


    <!-- LOGIN PAGE -->
    <section id="loginPage" class="page hidden">

        <div class="auth-card">

            <div class="small-logo">💬 SklChat</div>

            <h2>Welcome back</h2>

            <p>Log in to continue chatting.</p>

            <input
                id="loginUsername"
                type="text"
                placeholder="Username"
            >

            <input
                id="loginPassword"
                type="password"
                placeholder="Password"
            >

            <button id="enterChatButton" class="primary-button">
                Log In
            </button>

            <button id="backFromLogin" class="text-button">
                ← Back
            </button>

        </div>

    </section>


    <!-- SIGNUP PAGE -->
    <section id="signupPage" class="page hidden">

        <div class="auth-card">

            <div class="small-logo">💬 SklChat</div>

            <h2>Create your account</h2>

            <p>Join the SklChat community.</p>

            <input
                id="signupUsername"
                type="text"
                placeholder="Username"
            >

            <input
                id="signupEmail"
                type="email"
                placeholder="Email"
            >

            <input
                id="signupPassword"
                type="password"
                placeholder="Password"
            >

            <button id="createAccountButton" class="primary-button">
                Create Account
            </button>

            <button id="backFromSignup" class="text-button">
                ← Back
            </button>

        </div>

    </section>


    <!-- CHAT PAGE -->
    <section id="chatPage" class="hidden">

        <header class="topbar">

            <div class="logo">
                💬 SklChat
            </div>

            <div class="user">
                🟢 <span id="currentUser">Guest</span>
            </div>

        </header>


        <div class="app">

            <aside class="sidebar">

                <h3>CHAT ROOMS</h3>

                <button class="room active">
                    💬 General
                </button>

                <button class="room">
                    🎮 Gaming
                </button>

                <button class="room">
                    🎵 Music
                </button>


                <h3 id="onlineTitle">
                    ONLINE — 0
                </h3>

                <div id="onlineUsers">
                    <!-- Online users will appear here later -->
                </div>

            </aside>


            <main class="chat">

                <div class="chat-header">

                    <div>

                        <h2 id="chatTitle">
                            💬 General
                        </h2>

                        <p id="chatDescription">
                            Talk. Connect. Chill.
                        </p>

                    </div>

                </div>


                <div
                    class="messages"
                    id="messages"
                >
                    <!-- Messages appear here -->
                </div>


                <div class="message-input">

                    <input
                        type="text"
                        id="messageInput"
                        placeholder="Message General..."
                    >

                    <button id="sendButton">
                        Send
                    </button>

                </div>

            </main>

        </div>

    </section>


    <!-- JavaScript -->
    <script src="app.js"></script>

</body>
</html>
