<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SklChat</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">
        <div class="logo">💬 SklChat</div>

        <div class="user">
            🟢 <span id="currentUser">Guest</span>
        </div>
    </header>

    <div class="app">

        <aside class="sidebar">

            <h3>CHAT ROOMS</h3>

            <button class="room active">💬 General</button>
            <button class="room">🎮 Gaming</button>
            <button class="room">🎵 Music</button>

            <h3 id="onlineTitle">ONLINE — 0</h3>

            <div id="onlineUsers">
                <!-- Online users will appear here later -->
            </div>

        </aside>

        <main class="chat">

            <div class="chat-header">
                <div>
                    <h2 id="chatTitle">💬 General</h2>
                    <p id="chatDescription">Talk. Connect. Chill.</p>
                </div>
            </div>

            <div class="messages" id="messages">
                <!-- Messages will appear here -->
            </div>

            <div class="message-input">

                <input
                    type="text"
                    placeholder="Message General..."
                    id="messageInput"
                >

                <button id="sendButton">Send</button>

            </div>

        </main>

    </div>

    <script src="app.js"></script>

</body>
</html>
