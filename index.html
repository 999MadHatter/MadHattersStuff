```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Afterhours</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         LANDING PAGE
    ========================== -->

    <section id="landingPage" class="page">

        <h1>🌙 Afterhours</h1>

        <p>Talk. Connect. Stay up.</p>

        <button id="loginButton">
            Log In
        </button>

        <button id="signupButton">
            Create Account
        </button>

    </section>


    <!-- =========================
         LOGIN PAGE
    ========================== -->

    <section id="loginPage" class="page hidden">

        <h1>Welcome Back</h1>

        <input
            id="loginUsername"
            type="text"
            placeholder="Username"
            autocomplete="username"
        >

        <input
            id="loginPassword"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
        >

        <button id="enterChatButton">
            Log In
        </button>

        <button id="backFromLogin">
            Back
        </button>

    </section>


    <!-- =========================
         SIGNUP PAGE
    ========================== -->

    <section id="signupPage" class="page hidden">

        <h1>Create Account</h1>

        <input
            id="signupUsername"
            type="text"
            placeholder="Username"
            maxlength="32"
            autocomplete="username"
        >

        <input
            id="signupEmail"
            type="email"
            placeholder="Email"
            autocomplete="email"
        >

        <input
            id="signupPassword"
            type="password"
            placeholder="Password"
            autocomplete="new-password"
        >

        <button id="createAccountButton">
            Create Account
        </button>

        <button id="backFromSignup">
            Back
        </button>

    </section>


    <!-- =========================
         CHAT PAGE
    ========================== -->

    <section id="chatPage" class="page hidden">

        <header class="topbar">

            <div class="logo">
                🌙 Afterhours
            </div>

            <button
                class="user"
                id="profileButton"
            >
                🟢 <span id="topUsername">MadHatter</span>
            </button>

        </header>


        <div class="app">


            <!-- SIDEBAR -->

            <aside class="sidebar">

                <h3>CHAT ROOMS</h3>

                <button class="room active">
                    💬 General
                </button>

                <button class="room">
                    🎮 Gaming
                </button>

                <button class="room">
                    🎵 Music
                </button>


                <h3 id="onlineTitle">
                    ONLINE — 0
                </h3>

                <div id="onlineUsers">
                    <!-- Online users will appear here -->
                </div>

            </aside>


            <!-- CHAT -->

            <main class="chat">

                <div class="chat-header">

                    <h2 id="chatTitle">
                        💬 General
                    </h2>

                    <p id="chatDescription">
                        Talk. Connect. Chill.
                    </p>

                </div>


                <div
                    id="messages"
                    class="messages"
                >
                    <!-- Messages appear here -->
                </div>


                <div class="message-input">

                    <input
                        id="messageInput"
                        type="text"
                        placeholder="Message 💬 General..."
                        maxlength="2000"
                    >

                    <button id="sendButton">
                        Send
                    </button>

                </div>

            </main>

        </div>

    </section>


    <!-- =========================
         PROFILE MODAL
    ========================== -->

    <div
        id="profileModal"
        class="modal hidden"
    >

        <div class="profile-card">

            <button
                id="closeProfile"
                class="close-button"
            >
                ×
            </button>

            <div
                id="profileAvatar"
                class="profile-avatar"
            >
                M
            </div>

            <h2 id="profileName">
                MadHatter
            </h2>

            <span
                id="profileRole"
                class="role owner"
            >
                Owner
            </span>

            <p id="profileBio">
                Building Afterhours 🔥
            </p>

            <p>
                🟢 Online
            </p>

            <button id="editProfileButton">
                Edit Profile
            </button>

        </div>

    </div>


    <!-- =========================
         EDIT PROFILE MODAL
    ========================== -->

    <div
        id="editProfileModal"
        class="modal hidden"
    >

        <div class="profile-card">

            <button
                id="closeEditProfile"
                class="close-button"
            >
                ×
            </button>

            <h2>
                Edit Profile
            </h2>


            <label for="editDisplayName">
                Display Name
            </label>

            <input
                id="editDisplayName"
                type="text"
                maxlength="32"
                placeholder="Display name"
            >


            <label for="editBio">
                Bio
            </label>

            <textarea
                id="editBio"
                maxlength="160"
                placeholder="Tell people about yourself..."
            ></textarea>


            <button id="saveProfileButton">
                Save Changes
            </button>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="app.js"></script>

</body>

</html>
```
